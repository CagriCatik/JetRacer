###############################################################################
#  ros_gz_bridge.yaml
#  ===================
#  Topic bridge configuration for the JetRacer Gazebo simulation.
#
#  Format: ros_gz_bridge parameter file.
#  Each entry maps a Gazebo topic ↔ ROS 2 topic with explicit message types.
#
#  Naming convention:
#    Gazebo internal topics use /jetracer/<name> prefix.
#    ROS 2 side uses the standard names that the autonomous stack already
#    expects, so the stack connects without any changes.
#
#  Bridge directions:
#    GZ_TO_ROS: Gazebo publishes → ROS 2 subscribes
#    ROS_TO_GZ: ROS 2 publishes  → Gazebo subscribes
#    BIDIRECTIONAL: both
###############################################################################

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/jetracer/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/jetracer/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/jetracer/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/jetracer/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Camera image — bridged to csi_cam_0/image_raw to match real CSI pipeline.
# The autonomous stack subscribes to csi_cam_0/image_raw/compressed;
# add a republisher node or use image_transport if compressed is needed.
- ros_topic_name: "/csi_cam_0/image_raw"
  gz_topic_name: "/jetracer/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# camera_info — published by the Gazebo camera sensor automatically
- ros_topic_name: "/csi_cam_0/camera_info"
  gz_topic_name: "/jetracer/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# LiDAR scan — matches /scan expected by collision_assurance and SLAM
- ros_topic_name: "/scan"
  gz_topic_name: "/jetracer/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# IMU — published from imu_link sensor
- ros_topic_name: "/imu/data"
  gz_topic_name: "/jetracer/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Clock — required when use_sim_time:=true so all ROS nodes use Gazebo wall clock
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
