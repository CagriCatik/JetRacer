# JetRacer ROS 2 centralized runtime configuration.
# Top-level bringup launch files pass this file to autonomy, steering conversion,
# and optional multipoint navigation.

lane_following:
  ros__parameters:
    start: true
    max_speed_ms: 0.35
    min_speed_ms: 0.05
    kp: 1.5
    ki: 0.0
    kd: 0.2
    integral_windup_limit: 2.0
    max_steering_rad: 0.6
    lateral_controller_type: "stanley"   # "stanley" or "mpc"
    gain_constant: 1.8
    damping_constant: 0.25
    steering_smoothing: 0.25
    controller_lookahead_m: 0.35
    controller_heading_points: 4
    mpc_horizon: 8
    mpc_dt: 0.1
    mpc_wheelbase: 0.255
    mpc_q_cte: 2.5
    mpc_q_heading: 1.5
    mpc_q_terminal: 3.0
    mpc_r_steer: 0.2
    mpc_r_steer_rate: 0.8
    mpc_cte_scale_px: 48.0
    mpc_speed_scale_ms: 0.35
    mpc_min_speed_ms: 0.05
    max_steering_rate_radps: 3.0
    cut_size: 68
    spline_smoothness: 10.0
    gradient_threshold: 14.0
    distance_maxima_gradient: 3
    num_waypoints: 6
    way_type: "center"
    smoothing_beta: 30.0
    fallback_lane_width_px: 220.0
    lane_width_ema_alpha: 0.25
    lane_width_min_px: 160.0
    lane_width_max_px: 280.0
    bev_vehicle_center_x_px: 160.0
    bev_vehicle_origin_y_px: 239.0
    bev_lateral_m_per_px: 0.0022
    bev_forward_m_per_px: 0.0030
    speed_curvature_gain: 2.5
    speed_confidence_floor: 0.35
    path_frame_id: "base_link"
    publish_debug_image: true
    camera_topic: "csi_cam_0/image_raw/compressed"
    camera_info_topic: "csi_cam_0/camera_info"
    use_camera_calibration: true
    publish_ackermann_drive: true
    publish_legacy_twist: true

yolo_detection:
  ros__parameters:
    model_path: "yolo11n-best.engine"
    conf_thres: 0.65
    device: "cuda:0"
    camera_topic: "csi_cam_0/image_raw/compressed"
    output_topic: "perception/yolo_debug/compressed"
    detection_topic: "perception/yolo_detections"
    publish_debug: true

semantic_behavior:
  ros__parameters:
    trigger_class_name: "stop"
    camera_width: 640.0
    camera_height: 480.0
    box_size_trigger_pct: 0.15
    stop_duration_sec: 4.0
    cooldown_sec: 5.0

collision_assurance:
  ros__parameters:
    cone_angle_deg: 30.0
    min_distance_m: 0.45

cmd_vel_to_steering:
  ros__parameters:
    input_topic: "cmd_vel_nav"
    output_topic: "cmd_vel_nav_steer"
    wheelbase: 0.255
    max_steering_angle: 0.60
    min_speed_for_steering: 0.05

foxglove_bridge:
  ros__parameters:
    port: 8765
    send_buffer_limit: 100000000

thermal_monitor:
  ros__parameters:
    update_period: 2.0
    warning_temp: 75.0
    critical_temp: 85.0

safety_supervisor:
  ros__parameters:
    min_voltage: 9.5
    max_temp: 82.0
    publish_period_sec: 0.05

multipoint_navigation:
  ros__parameters:
    goal_frame: "map"
    marker_topic: "path_point"
    clicked_point_topic: "clicked_point"
    initial_pose_topic: "initialpose"
    forward_initialpose_topic: "rtabmap/initialpose"
    loop_forever: true
    retry_failed_once: true

voice_commander:
  ros__parameters:
    model_path: "vosk-model-small-en-us-0.15"
    kitchen_x: 2.5
    kitchen_y: -1.2

teleop_key:
  ros__parameters:
    speed: 0.5
    turn: 1.0

teleop_joy:
  ros__parameters:
    x_speed: 0.3
    y_speed: 0.0
    w_speed: 1.0
    linear_axis: 3
    angular_axis: 0
    deadman_button: 6
    hz: 20
