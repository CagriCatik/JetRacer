# twist_mux configuration for JetRacer ROS 2
#
# Priority (highest = wins):
#  255 - Safety supervisor / collision halt
#   10 - Teleop keyboard/joystick   (operator override, immediate)
#    8 - Behavior stack             (semantic stop behaviors)
#    5 - Lane following             (autonomous AI pipeline)
#    3 - Nav2 controller_server     (Nav2 autonomous navigation)
#
# All sources have a timeout so the car stops if the topic goes silent.
#
# NOTE: twist_mux still consumes STEERING-ANGLE Twists for compatibility with
#       the downstream serial bridge. The lane follower now also publishes a
#       primary AckermannDriveStamped command on `drive_lane`, but keeps the
#       legacy Twist output on `cmd_vel_lane` so the existing mux/hardware path
#       continues to work unchanged.

twist_mux:
  ros__parameters:
    topics:
      - name: safety
        topic: cmd_vel_safety
        timeout: 0.2
        priority: 255
      - name: teleop
        topic: cmd_vel_teleop
        timeout: 0.1
        priority: 10
      - name: behavior
        topic: cmd_vel_behavior
        timeout: 0.3
        priority: 8
      - name: lane_following
        topic: cmd_vel_lane
        timeout: 0.3
        priority: 5
      - name: vision
        topic: cmd_vel_vision
        timeout: 0.5
        priority: 4
      - name: nav2
        topic: cmd_vel_nav_steer
        timeout: 0.5
        priority: 3
    locks: []
